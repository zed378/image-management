packages:
  - packages/*
  - services/*
  - apps/*
  - sdks/*

# Install scripts are denied unless listed true here. Native binaries
# (sharp/libvips, esbuild) and the git-hook installer need theirs.
allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  # testcontainers' optional SSH transport -- unused, Docker is reached
  # through the local socket/named pipe.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # bullmq's msgpack accelerator: its install script only rebuilds from
  # source; the prebuilt per-platform package is used without it.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - dependency-cruiser@18.4.0

# Security floors for transitive dependencies (P0-10, triaged in
# MEMORY/records/P0-10.md). Remove an entry once every consumer's own range
# already excludes the vulnerable versions.
overrides:
  # GHSA-g7r4-m6w7-qqqr (low; dev server on Windows). Build-time only.
  esbuild: ">=0.28.1"
