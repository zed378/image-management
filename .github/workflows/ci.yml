# CI pipeline (P0-03, docs/DEVOPS/02-CI-CD.md).
#
# Fail fast, cheapest first. `verify` runs on every push and pull request and
# gates merge; `integration` needs Docker and is slower, so it runs after
# `verify` succeeds rather than competing with it.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      # Static checks first, cheapest first (docs/ENGINEERING/10 "CI pipeline").
      - name: format
        run: pnpm format:check
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: module boundaries
        run: pnpm deps:check
      - name: unit tests
        run: pnpm test:unit
      - name: build
        run: pnpm build

  # P0-10 (docs/SECURITY/00, SEC-OPS-01/02). Runs beside `verify`, not after
  # it: a leaked secret should fail fast even when the code also fails.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job never installs (pnpm audit reads the lockfile), so there
          # is no store to cache. setup-node v5 enables the package-manager
          # cache by itself when package.json has `packageManager`; on a cache
          # miss its post step then fails saving a store that does not exist.
          package-manager-cache: false
      - name: dependency audit (blocking at high and critical)
        run: pnpm audit --audit-level=high
      - name: dependency audit (full report, informational)
        run: pnpm audit || true
      - name: secret scan (gitleaks, full history)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --no-banner --redact --config /repo/.gitleaks.toml

  integration:
    name: integration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      # Unit + integration together, because the coverage thresholds
      # (docs/ENGINEERING/09, vitest.config.ts) are over both: adapters and
      # the query layer are covered by integration tests by design.
      - name: tests with coverage thresholds (Testcontainers)
        run: pnpm test:coverage
